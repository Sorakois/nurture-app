    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: transparent; color: white; }

        /* === BACKGROUND & BANNER STYLES (Copied from nurture.html) === */
        .background-container {
            position: fixed; top: 0; left: 0; height: 100vh; width: 100vw;
            display: flex; justify-content: center; overflow: hidden;
            background: #1f1f28; z-index: -1; pointer-events: none;
        }
        .background-container svg { position: absolute; height: 100%; width: 100%; }
        .lines { opacity: 0.05; }
        .line { fill-rule: evenodd; clip-rule: evenodd; fill: #4C3A90; }
        .lights { opacity: 0.9; }
        .light { fill-rule: evenodd; clip-rule: evenodd; fill: #7A6BB5; }

        .banner { background-color: #16161c; color: white; padding: 8px; text-align: center; font-size: 2em; font-weight: bold; }
        .social-button { display: inline-flex; align-items: center; padding: 8px 16px; border-radius: 20px; text-decoration: none; margin: 0 5px; transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .social-button:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); }
        .discord-button { background-color: #5865F2; }
        .kofi-button { background-color: #FF5E5B; }
        .social-button img { height: 40px; vertical-align: middle; margin-right: 8px; transition: transform 0.3s ease; }
        .sub-text { font-size: 0.9em; color: white; font-weight: bold; }

        /* === GAME LAYOUT STYLES === */
        .game-layout { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .game-header { display: flex; align-items: center; gap: 20px; background-color: #2a2a35; padding: 30px; border-radius: 12px 12px 0 0; border: 1px solid #3a3a45; border-bottom: none; }
        .game-header img { width: 120px; height: 120px; border-radius: 12px; object-fit: cover; }
        .game-title { font-size: 2.5em; margin: 0 0 10px 0; }
        .game-dev { color: #aaa; font-family: monospace; font-size: 1.1em; margin: 0; }

        .sub-nav { display: flex; background-color: #1f1f28; border: 1px solid #3a3a45; border-radius: 0 0 12px 12px; overflow: hidden; }
        .sub-nav a { flex: 1; text-align: center; padding: 15px 20px; color: #aaa; text-decoration: none; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s ease; border-right: 1px solid #3a3a45; }
        .sub-nav a:last-child { border-right: none; }
        .sub-nav a:hover { background-color: #2a2a35; color: white; }
        .sub-nav a.active { background-color: #4C3A90; color: white; box-shadow: inset 0 -4px 0 #7A6BB5; }

        .content-area { background-color: #2a2a35; border: 1px solid #3a3a45; border-radius: 12px; padding: 40px; margin-top: 20px; min-height: 400px; }
    </style>
</head>

    <div class="banner">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <a href="/">
                    <img src="/Assets/nurture_banner.png" alt="Nurture Banner" style="height:90px; vertical-align:left; padding-left: 10px;">
                </a>
            </div>
            <div>
                <a href="https://www.discord.gg/5ypRXPXuX8" class="social-button discord-button">
                    <img src="/Assets/join_discord.png" alt="Discord Icon" onmouseover="this.style.transform='rotate(5deg)'" onmouseout="this.style.transform='rotate(0deg)'">
                    <span class="sub-text">Discord</span>
                </a>
                <a href="https://ko-fi.com/sorakoi" class="social-button kofi-button">
                    <img src="/Assets/kofi_icon.png" alt="Ko-fi Icon" onmouseover="this.style.transform='rotate(5deg)'" onmouseout="this.style.transform='rotate(0deg)'">
                    <span class="sub-text">Ko-fi</span>
                </a>
            </div>
        </div>
    </div>

    <div class="game-layout">
        <a href="/" style="color: #aaa; text-decoration: none; display: inline-block; margin-bottom: 20px;">
            ← Back to All Games
        </a>

        <div class="game-header">
            <img src="/Assets/placeholder.png" alt="Game Icon" id="gameIcon">
            <div>
                <h1 class="game-title" id="gameTitle">Loading...</h1>
                <p class="game-dev" id="gameDev">-</p>
            </div>
        </div>

        <div class="sub-nav" id="tabMenu">
            </div>

        <div class="content-area" id="dynamicContent">
            <h2>Loading content...</h2>
        </div>
    </div>

    <script>
        // BACKGROUND ANIMATION LOGIC
        function animateWithRandomNumber(myClass, from, to) {
            gsap.fromTo(myClass, 
                { y: from }, 
                { 
                    duration: Math.floor((Math.random() * 20) + 1), 
                    y: to, 
                    ease: "none", 
                    onComplete: animateWithRandomNumber, 
                    onCompleteParams: [myClass, from, to] 
                }
            );
        }

        const itemsDown = [".light4", ".light5", ".light6", ".light7", ".light8", ".light11", ".light12", ".light13", ".light14", ".light15", ".light16"];
        itemsDown.forEach(e => animateWithRandomNumber(e, -1080, 1080));
        
        const itemsUp = [".light1", ".light2", ".light3", ".light9", ".light10", ".light17"];
        itemsUp.forEach(e => animateWithRandomNumber(e, 1080, -1080));

        // =========================================
        // PAGE DATA LOGIC (Fluid SPA-style Tabs)
        // =========================================
        
        let gameData = null; // Store the fetched game data so we don't re-fetch it
        
        // 1. Parse the initial URL
        const pathParts = window.location.pathname.split('/').filter(p => p);
        const gameId = pathParts[1];
        let currentSection = pathParts[2] || 'overview';

        const sections = [
            { id: 'overview', label: 'Overview' },
            { id: 'guides', label: 'Guides' },
            { id: 'assets', label: 'Raw Assets' },
            { id: 'communities', label: 'Communities' },
            { id: 'mods', label: 'Mods' }
        ];

        const tabMenu = document.getElementById('tabMenu');
        const contentArea = document.getElementById('dynamicContent');
        
        // 2. Render the Tabs dynamically
        function renderTabs() {
            tabMenu.innerHTML = ''; // Clear existing tabs
            
            sections.forEach(sec => {
                const link = document.createElement('a');
                const url = sec.id === 'overview' ? `/games/${gameId}` : `/games/${gameId}/${sec.id}`;
                link.href = url;
                link.textContent = sec.label;
                
                if (sec.id === currentSection) {
                    link.classList.add('active');
                }
                
                // --- THE MAGIC: Intercept the click ---
                link.addEventListener('click', (e) => {
                    e.preventDefault(); // Stop the browser from hard-reloading
                    if (currentSection === sec.id) return; // Do nothing if clicking the active tab

                    currentSection = sec.id;
                    
                    // Update the address bar URL silently
                    window.history.pushState({}, '', url); 
                    
                    // Instantly update the UI
                    renderTabs(); 
                    renderContent(); 
                });
                
                tabMenu.appendChild(link);
            });
        }

        // 3. Render the Content Area instantly
        function renderContent() {
            if (!gameData) return;
            
            document.title = `Nurture | ${gameData.name} - ${currentSection.toUpperCase()}`;
            
            // Fade out slightly for a smooth transition (optional flair)
            contentArea.style.opacity = 0.5;
            
            setTimeout(() => {
                switch(currentSection) {
                    case 'guides':
                        contentArea.innerHTML = `<h2>Guides for ${gameData.name}</h2><p>List of guides goes here.</p>`;
                        break;
                    case 'assets':
                        contentArea.innerHTML = `<h2>Raw Assets</h2><p>Download sprites and audio for ${gameData.name} here.</p>`;
                        break;
                    case 'communities':
                        contentArea.innerHTML = `<h2>Communities</h2><p>Discord and Reddit links for ${gameData.name}.</p>`;
                        break;
                    case 'mods':
                        contentArea.innerHTML = `<h2>Mods</h2><p>Community mods repository.</p>`;
                        break;
                    default:
                        contentArea.innerHTML = `
                            <h2>Overview</h2>
                            <p>Age Rating: ${gameData.ratings?.age || 'N/A'}</p>
                            <p>F2P Friendly: ${gameData.ratings?.f2p || 'N/A'}</p>
                            <p>Story: ${gameData.ratings?.story || 'N/A'}</p>
                        `;
                }
                contentArea.style.opacity = 1;
            }, 50); // Tiny delay makes the swap feel intentional
        }

        // 4. Handle Browser Back/Forward Buttons
        window.addEventListener('popstate', () => {
            const parts = window.location.pathname.split('/').filter(p => p);
            currentSection = parts[2] || 'overview';
            renderTabs();
            renderContent();
        });

        // 5. Initial Page Load Fetch (Only happens ONCE per game)
        async function initPage() {
            try {
                const response = await fetch(`/api/games/${gameId}`);
                
                if (!response.ok) throw new Error('Game not found');
                
                gameData = await response.json(); // Save data to our global variable

                // Fill in the static header info once
                document.getElementById('gameTitle').textContent = gameData.name;
                document.getElementById('gameDev').textContent = gameData.developer;
                document.getElementById('gameIcon').src = gameData.banner_url || '/Assets/placeholder.png';
                
                // Add a CSS transition to the content area for the fade effect
                contentArea.style.transition = 'opacity 0.2s ease';
                
                renderTabs();
                renderContent();

            } catch (error) {
                console.error("Failed to load page data:", error);
                contentArea.innerHTML = `<h2>Error loading game data.</h2>`;
            }
        }

        // Boot it up
        initPage();
    </script>
