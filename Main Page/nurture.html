<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/Assets/nurture_icon.ico">
    <title>Nurture | Meta, Guides, Assets, & Communities</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: transparent; /* Set to transparent so the animated background shows */
        }

        /* =========================================
           ANIMATED BACKGROUND STYLES
           ========================================= */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            overflow: hidden;
            background: #1f1f28; /* Your original dark theme color */
            z-index: -1;         /* Pins it behind all site content */
            pointer-events: none; /* Prevents it from blocking clicks/hovers */
        }
        .background-container svg {
            position: absolute;
            height: 100%;
            width: 100%;
        }
        .lines { opacity: 0.05; }
        .line { fill-rule: evenodd; clip-rule: evenodd; fill: #4C3A90; }
        .lights { opacity: 0.9; }
        .light { fill-rule: evenodd; clip-rule: evenodd; fill: #7A6BB5; }

        /* =========================================
           MAIN LAYOUT STYLES
           ========================================= */
        .banner {
            background-color: #16161c;
            color: white;
            padding: 8px;
            text-align: center;
            font-size: 2em;
            font-weight: bold;
        }
        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
            padding: 20px 0;
            gap: 20px;
        }
        .social-button {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            margin: 0 5px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .social-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .discord-button { background-color: #5865F2; }
        .kofi-button { background-color: #FF5E5B; }
        .social-button img {
            height: 40px;
            vertical-align: middle;
            margin-right: 8px;
            transition: transform 0.3s ease;
        }
        .sub-text {
            font-size: 0.9em;
            color: white;
            font-weight: bold;
        }
        .search-container {
            text-align: center;
            margin: 20px auto;
            width: 80%;
            max-width: 600px;
        }
        .search-input {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 25px;
            background-color: #2a2a35;
            color: white;
        }
        .suggestions {
            position: absolute;
            background-color: #2a2a35;
            width: 80%;
            max-width: 600px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .suggestion-item {
            padding: 10px;
            color: white;
            cursor: pointer;
        }
        .suggestion-item:hover {
            background-color: #3a3a45;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid-item {
            background-color: #2a2a35;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .grid-item:hover {
            transform: translateY(-5px);
        }
        .grid-item img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
        
        /* New Title & Icon Formatting */
        .title-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            gap: 8px; 
        }
        .grid-item-title {
            color: white;
            font-size: 14px;
            margin: 0; 
        }
        .info-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 20px;
            height: 20px;
            background-color: #3a3a45;
            color: #aaa;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .info-icon:hover {
            background-color: #ffc107;
            color: #000;
            transform: scale(1.1);
        }

        /* =========================================
           MODAL OVERLAY & ANIMATION
           ========================================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-window {
            background-color: #1f1f28; 
            border: 1px solid #3a3a45;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            padding: 24px;
            position: relative;
            color: white;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            
            /* CSS Variables for Dynamic Origin Animation */
            --start-x: 0px;
            --start-y: 20px;
            
            /* Start scaled down and translated to the exact card coordinates */
            transform: translate(var(--start-x), var(--start-y)) scale(0.25);
            transform-origin: center;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-window {
            transform: translate(0, 0) scale(1);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: #888;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #ff5c5c;
        }

        .modal-title {
            margin: 0 0 15px 0;
            font-size: 1.8em;
            border-bottom: 1px solid #3a3a45;
            padding-bottom: 10px;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            height: 0;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .ratings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .rating-box {
            background-color: #2a2a35; 
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #3a3a45;
        }

        .rating-label {
            font-size: 0.85em;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .rating-value {
            font-size: 1.25em;
            font-weight: bold;
            color: #ffc107;
        }

        .rating-box.overall {
            grid-column: span 3;
            background: linear-gradient(135deg, #3a3a45 0%, #2a2a35 100%);
            border: 1px solid #ffc107;
        }
    </style>
</head>

    <script>
        // =========================================
        // BACKGROUND ANIMATION LOGIC (GSAP 3)
        // =========================================
        function animateWithRandomNumber(myClass, from, to) {
            gsap.fromTo(myClass, 
                { y: from }, 
                { 
                    duration: Math.floor((Math.random() * 20) + 1), 
                    y: to, 
                    ease: "none", 
                    onComplete: animateWithRandomNumber, 
                    onCompleteParams: [myClass, from, to] 
                }
            );
        }

        const itemsDown = [".light4", ".light5", ".light6", ".light7", ".light8", ".light11", ".light12", ".light13", ".light14", ".light15", ".light16"];
        itemsDown.forEach(e => animateWithRandomNumber(e, -1080, 1080));
        
        const itemsUp = [".light1", ".light2", ".light3", ".light9", ".light10", ".light17"];
        itemsUp.forEach(e => animateWithRandomNumber(e, 1080, -1080));

        // =========================================
        // APP LOGIC & DATABASE
        // =========================================
        let allGames = [];
        let currentPage = 1;
        const gamesPerPage = 20;

        // DOM elements
        const searchInput = document.getElementById('searchInput');
        const gameGrid = document.getElementById('gameGrid');
        const suggestionsDiv = document.getElementById('suggestions');

        // Modal DOM elements
        const gameModal = document.getElementById('gameModal');
        const modalWindowContent = document.getElementById('modalWindowContent');
        const closeModalBtn = document.getElementById('closeModal');
        const modalGameTitle = document.getElementById('modalGameTitle');
        const modalTrailer = document.getElementById('modalTrailer');
        const modalAge = document.getElementById('modalAge');
        const modalF2P = document.getElementById('modalF2P');
        const modalAFK = document.getElementById('modalAFK');
        const modalStory = document.getElementById('modalStory');
        const modalGameplay = document.getElementById('modalGameplay');
        const modalOverall = document.getElementById('modalOverall');

        // API base URL
        const API_BASE = window.location.origin + '/api';
        
        let currentTrailerId = ''; 

        // Utility functions
        const debounce = (func, wait) => {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        };

        const showError = (message) => {
            console.error(message);
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #ff5555;
                color: white;
                padding: 10px 20px;
                border-radius: 5px;
                z-index: 1000;
            `;
            errorDiv.textContent = message;
            document.body.appendChild(errorDiv);
            
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        };

        // API call function
        const apiCall = async (endpoint, options = {}) => {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }

                return await response.json();
            } catch (error) {
                console.error(`API call failed for ${endpoint}:`, error);
                throw error;
            }
        };

        // Load games from local API
        const loadGames = async (page = 1) => {
            try {
                const data = await apiCall(`/games?page=${page}&limit=${gamesPerPage}`);
                
                if (data.games) {
                    allGames = data.games;
                    updateGrid(allGames);
                }
            } catch (error) {
                showError('Failed to load games from the server.');
                updateGrid([]); // Load an empty grid
            }
        };

        // Search games
        const searchGames = async (query) => {
            if (!query || query.length === 0) {
                updateGrid(allGames);
                return;
            }
            if (query.length < 2) return;

            try {
                const results = await apiCall(`/games/search/${encodeURIComponent(query)}`);
                updateGrid(results);
            } catch (error) {
                const filtered = allGames.filter(game => 
                    game.name.toLowerCase().includes(query.toLowerCase())
                );
                updateGrid(filtered);
            }
        };

        // Modal Logic
        function openGameModal(game, cardElement) {
            const rect = cardElement.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;
            const cardCenterY = rect.top + rect.height / 2;
            const viewportCenterX = window.innerWidth / 2;
            const viewportCenterY = window.innerHeight / 2;
            
            const deltaX = cardCenterX - viewportCenterX;
            const deltaY = cardCenterY - viewportCenterY;
            
            modalWindowContent.style.setProperty('--start-x', `${deltaX}px`);
            modalWindowContent.style.setProperty('--start-y', `${deltaY}px`);

            modalGameTitle.textContent = game.name || 'Unknown Game';
            
            if (game.trailer_id && currentTrailerId !== game.trailer_id) {
                modalTrailer.src = `https://www.youtube-nocookie.com/embed/${game.trailer_id}?autoplay=1`;
                currentTrailerId = game.trailer_id;
            } else if (!game.trailer_id) {
                modalTrailer.src = ''; 
                currentTrailerId = '';
            }
            
            modalAge.textContent = game.ratings?.age || 'N/A';
            modalF2P.textContent = game.ratings?.f2p || 'N/A';
            modalAFK.textContent = game.ratings?.afk || 'N/A';
            modalStory.textContent = game.ratings?.story || 'N/A';
            modalGameplay.textContent = game.ratings?.gameplay || 'N/A';
            modalOverall.textContent = game.ratings?.overall || 'N/A';
            
            gameModal.classList.add('active');
        }

        function closeGameModal() {
            gameModal.classList.remove('active');
            setTimeout(() => { 
                modalTrailer.src = ''; 
                currentTrailerId = '';
            }, 400); 
        }

        // Close when clicking the "X"
        closeModalBtn.addEventListener('click', closeGameModal);

        // Close when clicking the dark background overlay
        gameModal.addEventListener('click', function(e) {
            if (e.target === gameModal) {
                closeGameModal();
            }
        });

        // Grid Rendering
        function updateGrid(games) {
            gameGrid.innerHTML = ''; 
            
            if (games.length === 0) {
                gameGrid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; color: white; padding: 40px;">
                        <h3>No games found</h3>
                        <p>Try adjusting your search terms</p>
                    </div>
                `;
                return;
            }

            games.forEach(game => {
                const gridItem = document.createElement('div');
                gridItem.className = 'grid-item';
                
                const gameName = typeof game === 'string' ? game : game.name;
                const iconUrl = typeof game === 'object' && game.banner_url ? game.banner_url : '/Assets/placeholder.png';
                const developer = typeof game === 'object' && game.developer ? game.developer : '';
                
                gridItem.innerHTML = `
                    <img src="${iconUrl}" alt="${gameName}" loading="lazy" 
                         onerror="this.src='/Assets/placeholder.png'">
                    <div class="title-wrapper">
                        <div class="grid-item-title">${escapeHtml(gameName)}</div>
                        <div class="info-icon" title="View Game Details">i</div>
                    </div>
                    ${developer ? `<div class="grid-item-dev" style="font-size: 12px; color: #ccc; margin-top: 5px;">${escapeHtml(developer)}</div>` : ''}
                `;
                
                // CLICK "i" ICON: Open Modal and prevent the main card click
                const infoBtn = gridItem.querySelector('.info-icon');
                infoBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Stops the click from triggering the sub-page navigation
                    openGameModal(typeof game === 'object' ? game : { name: gameName }, gridItem);
                });
                
                // CLICK CARD: Independent navigation
                gridItem.addEventListener('click', () => {
                    // If the game object has an ID, navigate to it!
                    if (game.id) {
                        window.location.href = `/games/${game.id}`;
                    }
                });
                
                gameGrid.appendChild(gridItem);
            });
        }

        // Fixed HTML Escape function to prevent JS Syntax errors
        const escapeHtml = (text) => {
            const map = {
                '&': '&',
                '<': '<',
                '>': '>',
                '"': '"',
                "'": '&#39;'
            };
            return text.replace(/[&<>"']/g, (m) => map[m]);
        };

        const debouncedSearch = debounce(searchGames, 300);

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            loadGames();
        });

        searchInput.addEventListener('input', function() {
            debouncedSearch(this.value.trim());
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                this.value = '';
                updateGrid(allGames);
            }
        });

        document.addEventListener('click', function(e) {
            if (suggestionsDiv && !suggestionsDiv.contains(e.target) && e.target !== searchInput) {
                suggestionsDiv.style.display = 'none';
            }
        });

        window.addEventListener('online', () => loadGames());
    </script>
</body>
</html>
