<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/Assets/nurture_icon.ico">
    <title>Nurture | Meta, Guides, Assets, & Communities</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1f1f28;
        }
        .banner {
            background-color: #16161c;
            color: white;
            padding: 8px;
            text-align: center;
            font-size: 2em;
            font-weight: bold;
        }
        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
            padding: 20px 0;
            gap: 20px;
        }
        .social-button {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            margin: 0 5px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .social-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .discord-button { background-color: #5865F2; }
        .kofi-button { background-color: #FF5E5B; }
        .social-button img {
            height: 40px;
            vertical-align: middle;
            margin-right: 8px;
            transition: transform 0.3s ease;
        }
        .sub-text {
            font-size: 0.9em;
            color: white;
            font-weight: bold;
        }
        .search-container {
            text-align: center;
            margin: 20px auto;
            width: 80%;
            max-width: 600px;
        }
        .search-input {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 25px;
            background-color: #2a2a35;
            color: white;
        }
        .suggestions {
            position: absolute;
            background-color: #2a2a35;
            width: 80%;
            max-width: 600px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .suggestion-item {
            padding: 10px;
            color: white;
            cursor: pointer;
        }
        .suggestion-item:hover {
            background-color: #3a3a45;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid-item {
            background-color: #2a2a35;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .grid-item:hover {
            transform: translateY(-5px);
        }
        .grid-item img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
        
        /* New Title & Icon Formatting */
        .title-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            gap: 8px; 
        }
        .grid-item-title {
            color: white;
            font-size: 14px;
            margin: 0; 
        }
        .info-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 20px;
            height: 20px;
            background-color: #3a3a45;
            color: #aaa;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .info-icon:hover {
            background-color: #ffc107;
            color: #000;
            transform: scale(1.1);
        }

        /* =========================================
           MODAL OVERLAY & ANIMATION
           ========================================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-window {
            background-color: #1f1f28; 
            border: 1px solid #3a3a45;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            padding: 24px;
            position: relative;
            color: white;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            
            /* CSS Variables for Dynamic Origin Animation */
            --start-x: 0px;
            --start-y: 20px;
            
            /* Start scaled down and translated to the exact card coordinates */
            transform: translate(var(--start-x), var(--start-y)) scale(0.25);
            transform-origin: center;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-window {
            transform: translate(0, 0) scale(1);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: #888;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #ff5c5c;
        }

        .modal-title {
            margin: 0 0 15px 0;
            font-size: 1.8em;
            border-bottom: 1px solid #3a3a45;
            padding-bottom: 10px;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            height: 0;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .ratings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .rating-box {
            background-color: #2a2a35; 
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #3a3a45;
        }

        .rating-label {
            font-size: 0.85em;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .rating-value {
            font-size: 1.25em;
            font-weight: bold;
            color: #ffc107;
        }

        .rating-box.overall {
            grid-column: span 3;
            background: linear-gradient(135deg, #3a3a45 0%, #2a2a35 100%);
            border: 1px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <img src="/Assets/nurture_banner.png" alt="Nurture Banner" style="height:90px; vertical-align:left; padding-left: 10px;">
            </div>
            <div>
                <a href="https://www.discord.gg/5ypRXPXuX8" class="social-button discord-button">
                    <img src="/Assets/join_discord.png" alt="Discord Icon" onmouseover="this.style.transform='rotate(5deg)'" onmouseout="this.style.transform='rotate(0deg)'">
                    <span class="sub-text">Discord</span>
                </a>
                <a href="https://ko-fi.com/sorakoi" class="social-button kofi-button">
                    <img src="/Assets/kofi_icon.png" alt="Ko-fi Icon" onmouseover="this.style.transform='rotate(5deg)'" onmouseout="this.style.transform='rotate(0deg)'">
                    <span class="sub-text">Ko-fi</span>
                </a>
            </div>
        </div>
    </div>

    <div class="about-us" style="text-align: center; padding: 40px; color: white;">
        <h1 style="font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 2.5em; margin-bottom: 20px;">
            Nurture
        </h1>
        <p style="font-family:monospace; font-size: 1.2em; color: #cccccc;">
            The best place to find <u>guides</u>, the latest metas, raw assets, and communities for all your favorite gacha games!
        </p>
    </div>

    <div class="search-container">
        <input type="text" class="search-input" placeholder="Search games..." id="searchInput">
        <div class="suggestions" id="suggestions"></div>
    </div>

    <div class="grid-container" id="gameGrid">
    </div>

    <div id="gameModal" class="modal-overlay">
        <div class="modal-window" id="modalWindowContent">
            <button class="modal-close" id="closeModal">×</button>
            <h2 class="modal-title" id="modalGameTitle">Game Title</h2>
            
            <div class="video-container">
                <iframe id="modalTrailer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            
            <div class="ratings-grid">
                <div class="rating-box">
                    <div class="rating-label">Age Rating</div>
                    <div class="rating-value" id="modalAge">-</div>
                </div>
                <div class="rating-box">
                    <div class="rating-label">F2P Rating</div>
                    <div class="rating-value" id="modalF2P">-</div>
                </div>
                <div class="rating-box">
                    <div class="rating-label">AFK Rating</div>
                    <div class="rating-value" id="modalAFK">-</div>
                </div>
                <div class="rating-box">
                    <div class="rating-label">Story Rating</div>
                    <div class="rating-value" id="modalStory">-</div>
                </div>
                <div class="rating-box">
                    <div class="rating-label">Gameplay Rating</div>
                    <div class="rating-value" id="modalGameplay">-</div>
                </div>
                <div class="rating-box overall">
                    <div class="rating-label">Overall Average Rating</div>
                    <div class="rating-value" id="modalOverall">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Database-powered game management 
        let allGames = [];
        let currentPage = 1;
        const gamesPerPage = 20;

        // DOM elements
        const searchInput = document.getElementById('searchInput');
        const gameGrid = document.getElementById('gameGrid');
        const suggestionsDiv = document.getElementById('suggestions');

        // Modal DOM elements
        const gameModal = document.getElementById('gameModal');
        const modalWindowContent = document.getElementById('modalWindowContent');
        const closeModalBtn = document.getElementById('closeModal');
        const modalGameTitle = document.getElementById('modalGameTitle');
        const modalTrailer = document.getElementById('modalTrailer');
        const modalAge = document.getElementById('modalAge');
        const modalF2P = document.getElementById('modalF2P');
        const modalAFK = document.getElementById('modalAFK');
        const modalStory = document.getElementById('modalStory');
        const modalGameplay = document.getElementById('modalGameplay');
        const modalOverall = document.getElementById('modalOverall');

        // API base URL
        const API_BASE = window.location.origin + '/api';
        
        let currentTrailerId = ''; 

        // Utility functions
        const debounce = (func, wait) => {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        };

        const showError = (message) => {
            console.error(message);
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #ff5555;
                color: white;
                padding: 10px 20px;
                border-radius: 5px;
                z-index: 1000;
            `;
            errorDiv.textContent = message;
            document.body.appendChild(errorDiv);
            
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        };

        // API call function
        const apiCall = async (endpoint, options = {}) => {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }

                return await response.json();
            } catch (error) {
                console.error(`API call failed for ${endpoint}:`, error);
                throw error;
            }
        };

        // Load games from local API
        const loadGames = async (page = 1) => {
            try {
                const data = await apiCall(`/games?page=${page}&limit=${gamesPerPage}`);
                
                if (data.games) {
                    allGames = data.games;
                    updateGrid(allGames);
                }
            } catch (error) {
                showError('Failed to load games. Using offline data.');
                allGames = [
                    { name: 'Arknights', developer: 'Yostar Limited', banner_url: 'https://play-lh.googleusercontent.com/pBNlu-ZHQlVdfXhzI7TGIjqt_00sAeYFFK6AqTygfF3rwQfoPIkfIz-zROY31POTDKtxqcMDMPaDLJVlwCdc' },
                    { name: 'Arknights: Endfield', developer: 'Yostar Limited', banner_url: 'https://play-lh.googleusercontent.com/l6FVNa293RykBWy88TqEhUakIcGSC8bRygSnKOBgztln48JX-WzMWnrBAETrKZsxDNC4HhwCsvfle_UI7rBE' },
                    { name: 'Blue Archive', developer: 'Nexon', banner_url: 'https://play-lh.googleusercontent.com/lrERcCoTm7m8XStnhTHZDVfemQc_vTzCRl4CCBKhvQoBXo-WvmrwiGqONB7daFIJJkT0znGB5EOfgbaNRgiTyQ' },
                    { name: 'BrownDust2', developer: 'Neowiz', banner_url: 'https://play-lh.googleusercontent.com/EU57oDE8N2ZfMo3ina1NN37ZKhrG5_OJ7a7a2R_DsLLRUHFQJI6vM3e780DCIJ43DpEeUi_r8c82bs7G-a7j' },
                    { name: 'CookieRun: Kingdom', developer: 'Devsisters, Studio Kingdom ', banner_url: 'https://play-lh.googleusercontent.com/J1zzZf_Clyg51sikuBbfTMD_sGVK64Ki5vyVtn3MmkUUzQ-AxKWq2-WuVDnpkrpai6Icun3wXspttadNAxy4djI' },
                    { name: 'Genshin Impact', developer: 'miHoYo', banner_url: 'https://play-lh.googleusercontent.com/YQqyKaXX-63krqsfIzUEJWUWLINxcb5tbS6QVySdxbS7eZV7YB2dUjUvX27xA0TIGtfxQ5v-tQjwlT5tTB-O=w280-h280' },
                    { name: 'Goddess of Victory: NIKKE', developer: 'Shift Up', banner_url: 'https://play-lh.googleusercontent.com/JK5mejs0bVT_9613gCxNfCjRw_m3JiQ4wC8B8Kt471yu7ThFQazVkCLTfPZ81hnenft7ilaE-qSwVGpQT6sEFcY' },
                    { 
                        name: 'Honkai: Star Rail', 
                        developer: 'miHoYo', 
                        banner_url: 'https://play-lh.googleusercontent.com/aWrGocSA7hEuk1qAPe7L4T57LvLKrwwH26cK2_LOqxRQMQX7j3uHYojC-EKWgYEV2PdrmE0ahqvvhLhXrAGk6Q',
                        trailer_id: 'w8v__Mma2w0', 
                        ratings: { age: 'T', f2p: '4.2/5', afk: '4.0/5', story: '4.8/5', gameplay: '4.5/5', overall: '4.38/5' }
                    },
                    { name: 'Reverse: 1999', developer: 'Bluepoch Co.,Ltd.', banner_url: 'https://play-lh.googleusercontent.com/35wW4EuYqdU1ItNGOcXQc7elbbEIgk1LCE693GOJrIyc2NLC8dGeMs1fchPepzZim_Sif-Q-aFJhyDqr1JEx' },
                    { name: 'NTE: Neverness To Everness', developer: 'Hotta Studio', banner_url: 'https://play-lh.googleusercontent.com/TGl3DdDbi4hty6ooOhEvv_2s5tkpGLbL6derP8y5hK-_Bw--Ve375b08ba9HHQ9ueRpoQ9oye1T_T24BJriLUmw' },
                    { 
                        name: 'Wuthering Waves', 
                        developer: 'HK KURO GAMES LIMITED', 
                        banner_url: 'https://play-lh.googleusercontent.com/kP-iYZI3TL5GzvDKjtjtu2P_POG8sz7NZaP3hOw3WqDcZeZ7YcAQuY-aH8C_4tAPOk7W9rhi4OSZCWIK_e3FA0s',
                        trailer_id: 'Tf0pE_Yy7G8',
                        ratings: { age: 'T', f2p: '3.8/5', afk: '2.5/5', story: '3.5/5', gameplay: '4.9/5', overall: '3.68/5' }
                    },
                    { name: 'Umamusume: Pretty Derby', developer: 'Cygames, Inc.', banner_url: 'https://play-lh.googleusercontent.com/yN6cCSP7UB_2bsvlCxrtv-FUpEt1IvEFwr0Ucb3wr39QsAd5PLsueSVXuCinDbE4rifhMlX4YNtpLpkGnpsLhCQ' },
                ];
                updateGrid(allGames);
            }
        };

        // Search games
        const searchGames = async (query) => {
            if (!query || query.length === 0) {
                updateGrid(allGames);
                return;
            }
            if (query.length < 2) return;

            try {
                const results = await apiCall(`/games/search/${encodeURIComponent(query)}`);
                updateGrid(results);
            } catch (error) {
                const filtered = allGames.filter(game => 
                    game.name.toLowerCase().includes(query.toLowerCase())
                );
                updateGrid(filtered);
            }
        };

        // Modal Logic
        function openGameModal(game, cardElement) {
            const rect = cardElement.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;
            const cardCenterY = rect.top + rect.height / 2;
            const viewportCenterX = window.innerWidth / 2;
            const viewportCenterY = window.innerHeight / 2;
            
            const deltaX = cardCenterX - viewportCenterX;
            const deltaY = cardCenterY - viewportCenterY;
            
            modalWindowContent.style.setProperty('--start-x', `${deltaX}px`);
            modalWindowContent.style.setProperty('--start-y', `${deltaY}px`);

            modalGameTitle.textContent = game.name || 'Unknown Game';
            
            if (game.trailer_id && currentTrailerId !== game.trailer_id) {
                modalTrailer.src = `https://www.youtube.com/embed/${game.trailer_id}?autoplay=1`;
                currentTrailerId = game.trailer_id;
            } else if (!game.trailer_id) {
                modalTrailer.src = ''; 
                currentTrailerId = '';
            }
            
            modalAge.textContent = game.ratings?.age || 'N/A';
            modalF2P.textContent = game.ratings?.f2p || 'N/A';
            modalAFK.textContent = game.ratings?.afk || 'N/A';
            modalStory.textContent = game.ratings?.story || 'N/A';
            modalGameplay.textContent = game.ratings?.gameplay || 'N/A';
            modalOverall.textContent = game.ratings?.overall || 'N/A';
            
            gameModal.classList.add('active');
        }

        function closeGameModal() {
            gameModal.classList.remove('active');
            setTimeout(() => { 
                modalTrailer.src = ''; 
                currentTrailerId = '';
            }, 400); 
        }

        // Close when clicking the "X"
        closeModalBtn.addEventListener('click', closeGameModal);

        // Close when clicking the dark background overlay
        gameModal.addEventListener('click', function(e) {
            if (e.target === gameModal) {
                closeGameModal();
            }
        });

        // Grid Rendering
        function updateGrid(games) {
            gameGrid.innerHTML = ''; 
            
            if (games.length === 0) {
                gameGrid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; color: white; padding: 40px;">
                        <h3>No games found</h3>
                        <p>Try adjusting your search terms</p>
                    </div>
                `;
                return;
            }

            games.forEach(game => {
                const gridItem = document.createElement('div');
                gridItem.className = 'grid-item';
                
                const gameName = typeof game === 'string' ? game : game.name;
                const iconUrl = typeof game === 'object' && game.banner_url ? game.banner_url : '/Assets/placeholder.png';
                const developer = typeof game === 'object' && game.developer ? game.developer : '';
                
                gridItem.innerHTML = `
                    <img src="${iconUrl}" alt="${gameName}" loading="lazy" 
                         onerror="this.src='/Assets/placeholder.png'">
                    <div class="title-wrapper">
                        <div class="grid-item-title">${escapeHtml(gameName)}</div>
                        <div class="info-icon" title="View Game Details">i</div>
                    </div>
                    ${developer ? `<div class="grid-item-dev" style="font-size: 12px; color: #ccc; margin-top: 5px;">${escapeHtml(developer)}</div>` : ''}
                `;
                
                // CLICK "i" ICON: Open Modal and prevent the main card click
                const infoBtn = gridItem.querySelector('.info-icon');
                infoBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Stops the click from triggering the sub-page navigation
                    openGameModal(typeof game === 'object' ? game : { name: gameName }, gridItem);
                });
                
                // CLICK CARD: Independent navigation
                gridItem.addEventListener('click', () => {
                    console.log(`Navigating to sub-page for ${gameName}...`);
                    // window.location.href = `/games/${gameName.toLowerCase().replace(/\s+/g, '-')}`;
                });
                
                gameGrid.appendChild(gridItem);
            });
        }

        // Properly escaped to avoid breaking the script
        const escapeHtml = (text) => {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            };
            return text.replace(/[&<>"']/g, (m) => map[m]);
        };

        const debouncedSearch = debounce(searchGames, 300);

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            loadGames();
        });

        searchInput.addEventListener('input', function() {
            debouncedSearch(this.value.trim());
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                this.value = '';
                updateGrid(allGames);
            }
        });

        document.addEventListener('click', function(e) {
            if (suggestionsDiv && !suggestionsDiv.contains(e.target) && e.target !== searchInput) {
                suggestionsDiv.style.display = 'none';
            }
        });

        window.addEventListener('online', () => loadGames());
    </script>
</body>
</html>
