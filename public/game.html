    <style>
        /* === GAME LAYOUT STYLES (BOTANICAL THEME) === */
        .game-layout {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: radial-gradient(circle at top right, rgba(157, 142, 199, 0.2), transparent 60%), rgba(30, 25, 43, 0.92);
            padding: 30px;
            border-radius: 24px 8px 0 0;
            border: 1px solid rgba(157, 142, 199, 0.28);
            border-bottom: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .game-header img#gameIcon {
            width: 120px;
            height: 120px;
            border-radius: 22px 6px 22px 6px;
            border: 2px solid rgba(208, 194, 247, 0.35);
            object-fit: cover;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
        }

        .game-title {
            font-size: 2.5em;
            margin: 0 0 10px 0;
            color: #f4f0ff;
        }

        .game-dev {
            color: #b8a6e8;
            font-family: monospace;
            font-size: 1.1em;
            margin: 0;
        }

        .redeem-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4c3780 0%, #2b1f4a 100%);
            border: 1px solid rgba(208, 194, 247, 0.4);
            border-radius: 18px 6px 18px 6px;
            padding: 12px;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        .redeem-btn:hover {
            background: linear-gradient(135deg, #7359b5 0%, #4c3780 100%);
            transform: translateY(-3px) scale(1.04);
            border-radius: 6px 18px 6px 18px;
            box-shadow: 0 6px 18px rgba(157, 142, 199, 0.4);
            border-color: #e5dcff;
        }

        .redeem-btn img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .sub-nav {
            display: flex;
            background-color: rgba(20, 16, 30, 0.95);
            border: 1px solid rgba(157, 142, 199, 0.28);
            border-radius: 0 0 8px 24px;
            overflow: hidden;
        }

        .sub-nav a {
            flex: 1;
            text-align: center;
            padding: 15px 20px;
            color: #a99ec7;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            border-right: 1px solid rgba(157, 142, 199, 0.15);
        }

        .sub-nav a:last-child {
            border-right: none;
        }

        .sub-nav a:hover {
            background-color: rgba(157, 142, 199, 0.12);
            color: #f4f0ff;
        }

        .sub-nav a.active {
            background: linear-gradient(180deg, rgba(104, 78, 168, 0.5) 0%, rgba(76, 58, 144, 0.85) 100%);
            color: white;
            box-shadow: inset 0 -4px 0 #d0c2f7;
        }

        .content-area {
            background: radial-gradient(circle at bottom left, rgba(123, 201, 150, 0.05), transparent 60%), rgba(30, 25, 43, 0.92);
            border: 1px solid rgba(157, 142, 199, 0.25);
            border-radius: 24px 8px 24px 8px;
            padding: 40px;
            margin-top: 20px;
            min-height: 400px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
        }
        
        /* === PETAL FILTER BAR STYLES === */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(20, 16, 30, 0.85);
            color: #b8a6e8;
            border: 1px solid rgba(157, 142, 199, 0.3);
            padding: 8px 18px;
            border-radius: 16px 5px 16px 5px;
            font-size: 0.85em;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .filter-btn:hover {
            background: rgba(157, 142, 199, 0.2);
            color: white;
            transform: translateY(-2px);
            border-radius: 5px 16px 5px 16px;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #7A6BB5 0%, #523d8a 100%);
            color: white;
            border-color: #e5dcff;
            box-shadow: 0 4px 12px rgba(122, 107, 181, 0.35);
        }

        /* === BOTANICAL CARD ITEM STYLES === */
        .item-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(20, 16, 30, 0.85);
            border: 1px solid rgba(157, 142, 199, 0.2);
            padding: 16px 20px;
            border-radius: 18px 6px 18px 6px;
            margin-bottom: 12px;
            text-decoration: none;
            color: white;
            transition: all 0.25s ease;
        }

        .item-card:hover {
            transform: translateX(6px);
            background: rgba(38, 32, 56, 0.95);
            border-color: #b8a6e8;
            box-shadow: 0 6px 18px rgba(122, 107, 181, 0.2);
        }

        .item-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .item-details {
            flex-grow: 1;
        }

        .item-title {
            font-size: 1.05em;
            font-weight: bold;
            color: #d0c2f7;
            margin: 0 0 4px 0;
        }

        .item-meta {
            font-size: 0.85em;
            color: #9a8fb8;
            margin: 0;
        }

        @media (max-width: 768px) {
            .game-layout { margin: 20px auto; padding: 0 10px; }
            .game-header { flex-direction: column; padding: 20px; text-align: center; gap: 15px; }
            .header-left { flex-direction: column; }
            .game-title { font-size: 1.8em; }
            .redeem-btn { width: 100%; box-sizing: border-box; }
            .sub-nav { flex-wrap: wrap; }
            .sub-nav a { flex: 1 1 33%; padding: 12px 10px; font-size: 0.8em; border-bottom: 1px solid rgba(157, 142, 199, 0.2); }
            .content-area { padding: 20px; }
            .filter-bar { justify-content: center; }
        }
    </style>
</head>

    <!-- Page Specific Script -->
    <script>
        let gameData = null;
        
        const pathParts = window.location.pathname.split('/').filter(p => p);
        const gameId = pathParts[1];
        let currentSection = pathParts[2] || 'overview';

        const sections = [
            { id: 'overview', label: 'Overview' },
            { id: 'guides', label: 'Guides/Tools' },
            { id: 'assets', label: 'Raw Assets' },
            { id: 'communities', label: 'Communities' },
            { id: 'mods', label: 'Mods' }
        ];

        const tabMenu = document.getElementById('tabMenu');
        const contentArea = document.getElementById('dynamicContent');
        let activeFilter = 'All';
        
        function renderTabs() {
            tabMenu.innerHTML = '';
            
            sections.forEach(sec => {
                const link = document.createElement('a');
                const url = sec.id === 'overview' ? `/games/${gameId}` : `/games/${gameId}?tab=${sec.id}`;
                link.href = url;
                link.textContent = sec.label;
                
                if (sec.id === currentSection) {
                    link.classList.add('active');
                }
                
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (currentSection === sec.id) return;

                    currentSection = sec.id;
                    activeFilter = 'All';
                    window.history.pushState({}, '', url); 
                    renderTabs(); 
                    renderContent(); 
                });
                
                tabMenu.appendChild(link);
            });
        }

        function getItemIcon(item, section) {
            if (item.icon_url) return item.icon_url;

            const platform = (Array.isArray(item.platform) ? item.platform.join(',') : (item.platform || '')).toLowerCase();
            
            if (platform.includes('google sheets')) return '/Assets/google_sheets_icon.webp';
            if (platform.includes('nurture')) return '/Assets/nurture_icon.png';
            if (platform.includes('fribbels')) return '/Assets/fribbels.webp';

            if (platform.includes('discord')) return 'https://cdn.simpleicons.org/discord/5865F2';
            if (platform.includes('reddit')) return 'https://cdn.simpleicons.org/reddit/FF4500';
            if (platform.includes('youtube')) return 'https://cdn.simpleicons.org/youtube/FF0000';
            if (platform.includes('twitter') || platform.includes('x')) return 'https://cdn.simpleicons.org/x/000000';

            const targetUrl = item.url || item.download_url;
            if (platform.includes('website') && targetUrl) {
                try {
                    return `https://t2.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent(targetUrl)}&size=64`;
                } catch (error) {
                    console.error("Invalid URL for favicon fetching:", targetUrl);
                }
            }

            const defaultIcons = {
                guides: 'https://api.iconify.design/fluent-emoji:blue-book.svg',
                assets: 'https://api.iconify.design/fluent-emoji:open-file-folder.svg',
                communities: 'https://api.iconify.design/fluent-emoji:people-hugging.svg',
                mods: 'https://api.iconify.design/fluent-emoji:puzzle-piece.svg'
            };

            return defaultIcons[section] || '/Assets/placeholder.png';
        }

        function buildFilterBar(items, categoryKey) {
            if (!items || items.length === 0) return '';

            const ignoredTags = ['nurture', 'google sheets'];

            let categories = ['All', ...new Set(items.flatMap(item => {
                const val = item[categoryKey];
                if (!val) return [];
                if (Array.isArray(val)) return val;
                if (typeof val === 'string' && val.includes(',')) {
                    return val.split(',').map(s => s.trim());
                }
                return [val];
            }).filter(Boolean))];
            
            categories = categories.filter(cat => cat === 'All' || !ignoredTags.map(t => t.toLowerCase()).includes(cat.toLowerCase()));

            if (categories.length <= 1) return ''; 

            setTimeout(() => {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        activeFilter = e.target.dataset.category;
                        renderContent();
                    });
                });
            }, 0);

            return `
                <div class="filter-bar">
                    ${categories.map(cat => `
                        <button class="filter-btn ${activeFilter === cat ? 'active' : ''}" data-category="${cat}">
                            ${cat}
                        </button>
                    `).join('')}
                </div>
            `;
        }
        // Fetch Game Leaderboard
        async function loadGameLeaderboard() {
            try {
                const res = await fetch(`/api/leaderboard/game/${gameId}`);
                const data = await res.json();
                const list = document.getElementById('gameLeaderboardList');
                if (!data.top10 || data.top10.length === 0) {
                    list.innerHTML = '<p style="color:#888; font-size:0.85em; text-align:center;">No contributors yet.</p>';
                    return;
                }
                
                list.innerHTML = data.top10.map((u, i) => `
                    <div class="lb-row ${i < 3 ? `rank-${i+1}` : ''}" style="cursor:pointer;" onclick="openUserProfileModal('${u.discordId}')">
                        <div class="lb-rank-badge">#${i+1}</div>
                        <img src="${u.avatar ? `https://cdn.discordapp.com/avatars/${u.discordId}/${u.avatar}.png` : '/Assets/placeholder.png'}" class="lb-avatar">
                        <div class="lb-info"><div class="lb-name">${u.username}</div></div>
                        <div class="lb-score">${u.points} pts</div>
                    </div>
                `).join('');

                const userRankContainer = document.getElementById('userGameRankContainer');
                if (data.userRank) {
                    userRankContainer.innerHTML = `
                    <div style="width: 100%; height: 1px; background: linear-gradient(90deg, transparent, rgba(157, 142, 199, 0.4), transparent); margin: 12px 0;"></div>
                    <div class="lb-row" style="border-color:#9d8ec7; margin-bottom: 0; cursor: pointer;" onclick="openUserProfileModal('${data.userRank.discordId}')">
                        <div class="lb-rank-badge">#${data.userRank.rank}</div>
                        <img src="${data.userRank.avatar ? `https://cdn.discordapp.com/avatars/${data.userRank.discordId}/${data.userRank.avatar}.png` : '/Assets/placeholder.png'}" class="lb-avatar">
                        <div class="lb-info"><div class="lb-name">You (${data.userRank.username})</div></div>
                        <div class="lb-score">${data.userRank.points} pts</div>
                    </div>`;
                }
            } catch (e) { 
                document.getElementById('leaderboardList') 
                    ? document.getElementById('leaderboardList').innerHTML = '<div class="lb-row" style="justify-content:center;color:#ccc;font-weight:bold;">NEW! Could be you!</div>'
                    : document.getElementById('gameLeaderboardList').innerHTML = '<div class="lb-row" style="justify-content:center;color:#ccc;font-weight:bold;">NEW! Could be you!</div>';
            }
        }
        function renderContent() {
            if (!gameData) return;
            
            document.title = `Nurture | ${gameData.name} - ${currentSection.toUpperCase()}`;
            contentArea.style.opacity = 0.5;
            
            const mfContainer = document.getElementById('miniFocusContainer');

            // ONLY show on the 'guides' section
            if (currentSection === 'guides' && gameData.mini_focuses && gameData.mini_focuses.length > 0) {
                mfContainer.style.display = 'grid';
                
                mfContainer.innerHTML = gameData.mini_focuses.map(focus => `
                        <div style="display: flex; align-items: center; gap: 15px; background: linear-gradient(135deg, #4C3A90 0%, #2a2a35 100%); padding: 18px; border-radius: 12px; border: 1px solid #7A6BB5; user-select: none;">
                            <img src="${focus.icon || '/Assets/placeholder.png'}" style="width: 50px; height: 50px; border-radius: 8px; object-fit: cover; border: 1px solid #3a3a45;">
                            <div>
                                <div style="font-weight: bold; font-size: 1.1em; color: #fff; margin-bottom: 4px;">${focus.title}</div>
                                <div style="font-size: 0.85em; color: #ccc;">${focus.description}</div>
                            </div>
                        </div>
                    `).join('');
            } else {
                // Hide entirely on Overview, Assets, Communities, and Mods
                mfContainer.style.display = 'none';
            }

            setTimeout(() => {
                if (currentSection === 'overview') {
                    const editOverviewSvg = `<svg onclick="openGameSuggestModal('Overview')" style="width:20px;height:20px;fill:#ffffff;float:right;cursor:pointer;margin-top:5px;" title="Edit Overview" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
                    
                    let guideContent = '';
                    if (gameData.new_player_video_id) {
                        // 1. Prioritize legacy embedded YouTube Video
                        guideContent = `
                            <div style="position: relative; width: 100%; padding-bottom: 56.25%; height: 0; border-radius: 8px; overflow: hidden; background: #000; margin-top: 10px;">
                                <iframe 
                                    src="https://www.youtube.com/embed/${gameData.new_player_video_id}" 
                                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;"
                                    allow="accelerometer; autoplay; clipboard-encrypted-media; gyroscope; picture-in-picture" 
                                    referrerpolicy="strict-origin-when-cross-origin"
                                    allowfullscreen>
                                </iframe>
                            </div>
                        `;
                    } else if (gameData.new_player_guide) {
                        // 2. Fallback to external URL Link Button
                        guideContent = `
                            <a href="${gameData.new_player_guide}" target="_blank" style="display:inline-block; padding:12px 20px; background:#4C3A90; color:white; text-decoration:none; border-radius:8px; border:1px solid #7A6BB5; font-weight:bold; margin-top:10px;">📺 View Recommended Guide</a>
                        `;
                    } else {
                        // 3. Fallback to Suggest Button
                        guideContent = `
                            <button onclick="openGameSuggestModal('Overview')" style="display:inline-block; padding:10px 16px; background:#2a2a35; color:#aaa; border:1px dashed #7A6BB5; border-radius:8px; cursor:pointer; margin-top:10px; transition:color 0.2s, border 0.2s;" onmouseover="this.style.color='#fff'; this.style.borderColor='#9d8ec7'" onmouseout="this.style.color='#aaa'; this.style.borderColor='#7A6BB5'">+ Suggest Beginner Guide</button>
                        `;
                    }
                    
                    let overviewHtml = `
                        <h2>Overview ${editOverviewSvg}</h2>
                        <p style="line-height: 1.6; color: #ddd; white-space: pre-wrap;">${gameData.overview_text || 'No overview available for this game yet.'}</p>
                        <h3 style="margin-top:40px; border-bottom:1px solid #3a3a45; padding-bottom:8px; color:#9d8ec7;">New Player Guide</h3>
                        ${guideContent}
                    `;

                    contentArea.innerHTML = overviewHtml;
                    contentArea.style.opacity = 1;
                    return;
                }

                const sectionConfig = {
                    guides: { title: 'Guides/Tools', dbKey: 'Guide', data: gameData.guides, catKey: 'category', metaKey: 'author', metaPrefix: 'By ' },
                    assets: { title: 'Raw Assets', dbKey: 'Asset', data: gameData.assets, catKey: 'type', metaKey: 'type', metaPrefix: 'Format: ' },
                    communities: { title: 'Communities', dbKey: 'Community', data: gameData.communities, catKey: 'platform', metaKey: 'platform', metaPrefix: 'Platform: ' },
                    mods: { title: 'Mods', dbKey: 'Mod', data: gameData.mods, catKey: 'author', metaKey: 'version', metaPrefix: 'Version: ' }
                };

                const config = sectionConfig[currentSection];
                const addNewBtn = `<button class="btn-floral" onclick="openGameSuggestModal('${config.dbKey}')" style="padding: 6px 14px; font-size: 0.6em;">🌸 + Add New</button>`;
                const headerHtml = `<h2 style="display: flex; justify-content: space-between; align-items: center;">${config.title} ${addNewBtn}</h2>`;

                if (!config || !config.data || config.data.length === 0) {
                    contentArea.innerHTML = headerHtml + `<p style="color: #aaa;">No items found.</p>`;
                    contentArea.style.opacity = 1;
                    return;
                }

                const filteredData = activeFilter === 'All' 
                    ? config.data 
                    : config.data.filter(item => {
                        const val = item[config.catKey];
                        if (!val) return false;
                        if (Array.isArray(val)) return val.includes(activeFilter);
                        if (typeof val === 'string' && val.includes(',')) return val.split(',').map(s => s.trim()).includes(activeFilter);
                        return val === activeFilter;
                    });

                const filterHtml = buildFilterBar(config.data, config.catKey);
                const safeStr = (text) => (text || '').toString().replace(/[&<>"']/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m]));

                // Store globally so the modal knows what to edit
                currentDisplayedItems = filteredData;

                const cardsHtml = filteredData.map((item, index) => {
                    let metaVal = item[config.metaKey];
                    if (Array.isArray(metaVal)) metaVal = metaVal.join(', ');
                    let metaHtml = safeStr(metaVal);
                    let primaryMeta = metaHtml ? `${config.metaPrefix}${metaHtml}` : '';

                    let submitterHtml = '';
                    let subName = item.submitterUsername || item.submitter;
                    if (subName) {
                        let safeSubName = safeStr(subName);
                        let subDiscordId = item.submitterDiscordId || '';
                        submitterHtml = `<span style="color:#7A6BB5; font-size: 0.9em; margin-left: 10px;">| Submitted by <span style="color:#9d8ec7; cursor:pointer; text-decoration:underline;" onclick="event.preventDefault(); event.stopPropagation(); openUserProfileModal('${subDiscordId}', '${safeSubName}')">${safeSubName}</span></span>`;
                    }
                    
                    // Individual edit pencil
                    const editBtnHtml = `
                        <div style="margin-left: auto; padding-left: 15px; display: flex; align-items: center;">
                            <svg onclick="event.preventDefault(); event.stopPropagation(); openGameSuggestModal('${config.dbKey}', ${index})" style="width:20px;height:20px;fill:#aaa;cursor:pointer;transition:fill 0.2s;" onmouseover="this.style.fill='#fff'" onmouseout="this.style.fill='#aaa'" title="Suggest Edit" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                        </div>
                    `;

                    return `
                        <a href="${safeStr(item.url || item.download_url || '#')}" target="_blank" class="item-card">
                            <img src="${getItemIcon(item, currentSection)}" class="item-icon" alt="icon" onerror="this.src='/Assets/placeholder.png'">
                            <div class="item-details">
                                <div class="item-title">${safeStr(item.title || item.name)}</div>
                                <div class="item-meta">${primaryMeta}${submitterHtml}</div>
                            </div>
                            ${editBtnHtml}
                        </a>
                    `;
                }).join('');

                contentArea.innerHTML = `
                    ${headerHtml}
                    ${filterHtml}
                    <div class="items-list">
                        ${cardsHtml || '<p style="color: #888;">No items match this filter.</p>'}
                    </div>
                `;
                
                contentArea.style.opacity = 1;
            }, 50);
        }

        window.addEventListener('popstate', () => {
            const urlParams = new URLSearchParams(window.location.search);
            let currentSection = urlParams.get('tab') || 'overview';
            renderTabs();
            renderContent();
        });

        async function initPage() {
            try {
                const response = await fetch(`/api/games/${gameId}`);
                if (!response.ok) throw new Error('Game not found');
                
                gameData = await response.json();

                document.getElementById('gameTitle').textContent = gameData.name;
                document.getElementById('gameDev').textContent = gameData.developer;
                document.getElementById('gameIcon').src = gameData.banner_url || '/Assets/placeholder.png';

                const mfContainer = document.getElementById('miniFocusContainer');
                if (gameData.mini_focuses && gameData.mini_focuses.length > 0) {
                    mfContainer.style.display = 'grid';
                    mfContainer.innerHTML = gameData.mini_focuses.map(focus => `
                        <div style="display: flex; align-items: center; gap: 15px; background: linear-gradient(135deg, #4C3A90 0%, #2a2a35 100%); padding: 18px; border-radius: 12px; border: 1px solid #7A6BB5; user-select: none;">
                            <img src="${focus.icon || '/Assets/placeholder.png'}" style="width: 50px; height: 50px; border-radius: 8px; object-fit: cover; border: 1px solid #3a3a45;">
                            <div>
                                <div style="font-weight: bold; font-size: 1.1em; color: #fff; margin-bottom: 4px;">${focus.title}</div>
                                <div style="font-size: 0.85em; color: #ccc;">${focus.description}</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    mfContainer.style.display = 'none';
                }

                const redeemBtn = document.getElementById('redeemCodesBtn');
                if (gameData.redeem_codes_url) {
                    redeemBtn.href = gameData.redeem_codes_url;
                    redeemBtn.style.display = 'inline-flex';
                } else {
                    redeemBtn.style.display = 'none';
                }
                
                loadGameLeaderboard();
                
                contentArea.style.transition = 'opacity 0.2s ease';
                renderTabs();
                renderContent();

            } catch (error) {
                console.error("Failed to load page data:", error);
                contentArea.innerHTML = `<h2>Error loading game data.</h2>`;
            }
        }

        let currentSuggestCategory = '';
        let currentSuggestAction = 'CREATE';
        let currentSuggestTarget = null;
        let currentDisplayedItems = []; 

        function openGameSuggestModal(category, itemIndex = null) {
            currentSuggestCategory = category;
            document.getElementById('gsCommit').value = '';
            
            const titleEl = document.getElementById('gsCategoryTitle');
            const historyBtn = document.getElementById('gsHistoryBtn');
            const overviewWrap = document.getElementById('gsOverviewWrap');
            
            if (category === 'Overview') {
                currentSuggestAction = 'EDIT';
                currentSuggestTarget = 'Overview Data';
                titleEl.textContent = 'Edit Overview';
                historyBtn.style.display = 'inline-flex';
                
                document.getElementById('gsStandardInputs').style.display = 'none';
                overviewWrap.style.display = 'flex';
                document.getElementById('gsOverviewText').style.display = 'block';
                document.getElementById('gsNewPlayerGuide').style.display = 'block';
                document.getElementById('gsOverviewText').value = gameData.overview_text || '';
                document.getElementById('gsNewPlayerGuide').value = gameData.new_player_guide || '';
            } else {
                document.getElementById('gsStandardInputs').style.display = 'flex';
                overviewWrap.style.display = 'none';
                document.getElementById('gsNewPlayerGuide').style.display = 'none';
                
                if (itemIndex !== null && currentDisplayedItems[itemIndex]) {
                    currentSuggestAction = 'EDIT';
                    titleEl.textContent = 'Edit Item';
                    historyBtn.style.display = 'inline-flex';
                    
                    const item = currentDisplayedItems[itemIndex];
                    currentSuggestTarget = item._id || item.title || item.name;
                    document.getElementById('gsTitle').value = item.title || item.name || '';
                    document.getElementById('gsAuthor').value = item.author || item.platform || item.type || item.version || '';
                    document.getElementById('gsUrl').value = item.url || item.download_url || '';
                } else {
                    currentSuggestAction = 'CREATE';
                    titleEl.textContent = 'Add New Item';
                    historyBtn.style.display = 'none';
                    currentSuggestTarget = null;
                    
                    document.getElementById('gsTitle').value = '';
                    document.getElementById('gsAuthor').value = '';
                    document.getElementById('gsUrl').value = '';
                }
            }
            document.getElementById('gameSuggestModal').classList.add('active');
        }

        async function viewEditHistory() {
            if (!currentSuggestTarget) return;
            document.getElementById('historyModal').classList.add('active');
            const content = document.getElementById('historyContent');
            content.innerHTML = '<p style="color:#aaa;">Loading history...</p>';

            try {
                const res = await fetch(`/api/history/${gameData.id}/${encodeURIComponent(currentSuggestTarget)}`);
                const history = await res.json();
                
                if (!history || history.length === 0) {
                    content.innerHTML = '<p style="color:#888;">No edit history found for this item.</p>';
                    return;
                }

                content.innerHTML = history.map(h => {
                    const date = new Date(h.createdAt || h.date || Date.now()).toLocaleString();
                    const msg = h.data?.commitMessage || 'No commit message provided.';
                    return `
                    <div style="background:#1f1f28; border:1px solid #3a3a45; padding:12px; border-radius:8px; margin-bottom:10px;">
                        <div style="display:flex; justify-content:space-between; font-size:0.85em; color:#aaa; margin-bottom:8px;">
                            <div><strong style="color:#7A6BB5;">${escapeHtml(h.submitterUsername || 'Unknown')}</strong> • ${h.actionType}</div>
                            <span>${date}</span>
                        </div>
                        <div style="color:#ddd; font-size:0.95em; border-left: 2px solid #4C3A90; padding-left: 10px;">${escapeHtml(msg)}</div>
                    </div>
                    `;
                }).join('');
            } catch (e) {
                content.innerHTML = '<p style="color:#ff5555;">Failed to load history.</p>';
            }
        }

        async function submitGameSuggestion() {
            const commitMessage = document.getElementById('gsCommit').value.trim();
            let dataPayload = {};

            if (currentSuggestCategory === 'Overview') {
                dataPayload = { 
                    overview_text: document.getElementById('gsOverviewText').value.trim(), 
                    new_player_guide: document.getElementById('gsNewPlayerGuide').value.trim(),
                    commitMessage 
                };
            } else {
                const title = document.getElementById('gsTitle').value.trim();
                const author = document.getElementById('gsAuthor').value.trim();
                const url = document.getElementById('gsUrl').value.trim();
                if (!title || !url) return alert("Title and URL are required.");
                dataPayload = { title, url, author, platform: author, type: author, version: author, commitMessage };
            }

            const payload = {
                gameId: gameData.id,
                // Automatically swaps 'Overview' to 'Game' to pass validation, but leaves 'Guide', 'Asset', etc alone
                itemCategory: currentSuggestCategory === 'Overview' ? 'Game' : currentSuggestCategory,
                actionType: currentSuggestAction,
                targetIdentifier: currentSuggestTarget || (dataPayload.title || 'New Item'),
                data: dataPayload
            };

            try {
                const response = await fetch('/api/contribute', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'Server rejected submission');
                }
                alert("Suggestion submitted successfully! Awaiting Admin Approval.");
                document.getElementById('gameSuggestModal').classList.remove('active');
            } catch (e) { alert("Failed to submit: " + e.message); }
        }

        initPage();

        // Silently monitor for Discord admin approvals every 15 seconds
        setInterval(async () => {
            // Do not refresh data while a modal is actively open to prevent typing interruptions
            if (document.visibilityState !== 'visible' || document.querySelector('.modal-overlay.active')) return;
            
            try {
                const res = await fetch(`/api/games/${gameId}`);
                if (res.ok) {
                    const newData = await res.json();
                    // If the database changed, instantly re-render the screen
                    if (JSON.stringify(newData) !== JSON.stringify(gameData)) {
                        gameData = newData;
                        renderContent();
                        loadGameLeaderboard();
                    }
                }
            } catch (e) {}
        }, 15000);
    </script>
</body>
</html>
