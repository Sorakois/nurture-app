    <style>
    .main-wrapper {
        display: flex;
        max-width: 1400px;
        margin: 0 auto;
        gap: 20px;
        padding: 20px;
    }
    .leaderboard-sidebar {
        width: 280px;
        background-color: #2a2a35;
        border: 1px solid #3a3a45;
        border-radius: 12px;
        padding: 20px;
        height: fit-content;
    }
    .lb-header {
        background-color: #FF5E5B;
        color: white;
        text-align: center;
        padding: 10px;
        border-radius: 8px;
        font-weight: bold;
        margin-bottom: 15px;
    }
    .lb-row {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #1f1f28;
        padding: 8px 12px;
        border-radius: 8px;
        margin-bottom: 8px;
        border: 1px solid #3a3a45;
    }
    .lb-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .lb-info { flex-grow: 1; overflow: hidden; }
    .lb-name { font-size: 0.85em; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lb-score { color: #ffc107; font-weight: bold; font-size: 0.9em; }
        .about-us {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .search-container {
            text-align: center;
            margin: 20px auto;
            width: 80%;
            max-width: 600px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 25px;
            background-color: #2a2a35;
            color: white;
            box-sizing: border-box;
        }

        .suggestions {
            position: absolute;
            background-color: #2a2a35;
            width: 80%;
            max-width: 600px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .suggestion-item {
            padding: 10px;
            color: white;
            cursor: pointer;
        }

        .suggestion-item:hover {
            background-color: #3a3a45;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-item {
            background-color: #2a2a35;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
        }

        .grid-item:hover {
            transform: translateY(-5px);
        }

        .grid-item img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
        
        .grid-item.no-data {
            filter: grayscale(100%);
            opacity: 0.4;
        }

        .grid-item.no-data:hover {
            transform: none; 
            opacity: 0.6;
        }

        .title-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            gap: 8px; 
        }

        .grid-item-title {
            color: white;
            font-size: 14px;
            margin: 0; 
        }

        .grid-item-dev {
            color: #ccc;
            margin-top: 5px;
            font-size: 12px; 
            transition: font-size 0.2s ease;
        }

        .info-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 20px;
            height: 20px;
            background-color: #3a3a45;
            color: #aaa;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .info-icon:hover {
            background-color: #ffc107;
            color: #000;
            transform: scale(1.1);
        }
        
        .info-icon.disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .info-icon.disabled:hover {
            background-color: #3a3a45;
            color: #aaa;
            transform: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-window {
            background-color: #1f1f28; 
            border: 1px solid #3a3a45;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            padding: 24px;
            position: relative;
            color: white;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            --start-x: 0px;
            --start-y: 20px;
            transform: translate(var(--start-x), var(--start-y)) scale(0.25);
            transform-origin: center;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-window {
            transform: translate(0, 0) scale(1);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: #888;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #ff5c5c;
        }

        .modal-title {
            margin: 0 0 15px 0;
            font-size: 1.8em;
            border-bottom: 1px solid #3a3a45;
            padding-bottom: 10px;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            height: 0;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .ratings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .rating-box {
            background-color: #2a2a35; 
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #3a3a45;
        }

        .rating-label {
            font-size: 0.85em;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .rating-value {
            font-size: 1.25em;
            font-weight: bold;
            color: #ffc107;
        }

        .rating-box.overall {
            grid-column: span 3;
            background: linear-gradient(135deg, #3a3a45 0%, #2a2a35 100%);
            border: 1px solid #ffc107;
        }

        /* === MOBILE RESPONSIVENESS === */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 15px;
            }
            
            .grid-item-title {
                font-size: 16px;
            }

            .grid-item-dev {
                font-size: 9px;
            }

            .search-container, .suggestions {
                width: 95%;
            }

            .about-us h1 {
                font-size: 2em;
            }

            .about-us p {
                font-size: 1em;
            }
        }
    </style>
</head>

    <!-- Page Specific Script -->
    <script>
        let allGames = [];
        let userStarredGames = [];
        let cachedSession = JSON.parse(localStorage.getItem('nurture_user_session') || '{}');
        let isLoading = false;
        let isSearching = false;

        async function fetchInitialData() {
            try {
                const lbRes = await fetch('/api/leaderboard');
                const lbData = await lbRes.json();
                const lbList = document.getElementById('leaderboardList');
                
                if (!lbData.top10 || lbData.top10.length === 0) {
                    lbList.innerHTML = '<div class="lb-row" style="justify-content:center;color:#ccc;font-weight:bold;">NEW! Could be you!</div>';
                } else {
                    lbList.innerHTML = lbData.top10.map((u, i) => `
                        <div class="lb-row">
                            <div style="font-weight:bold; color:#7A6BB5; width:25px;">#${i+1}</div>
                            <img src="${u.avatar ? `https://cdn.discordapp.com/avatars/${u.discordId}/${u.avatar}.png` : '/Assets/placeholder.png'}" class="lb-avatar">
                            <div class="lb-info"><div class="lb-name">${u.username}</div></div>
                            <div class="lb-score">${u.totalPoints} pts</div>
                        </div>
                    `).join('');

                    // Render 11th Tier into the pinned footer
                    const userRankContainer = document.getElementById('userRankContainer');
                    if (lbData.userRank) {
                        userRankContainer.innerHTML = `
                        <div style="width: 100%; height: 2px; background-color: #3a3a45; margin: 10px 0;"></div>
                        <div class="lb-row" style="border-color:#7A6BB5; margin-bottom: 0;">
                            <div style="font-weight:bold; color:#7A6BB5; width:25px;">#${lbData.userRank.rank}</div>
                            <img src="${lbData.userRank.avatar ? `https://cdn.discordapp.com/avatars/${lbData.userRank.discordId}/${lbData.userRank.avatar}.png` : '/Assets/placeholder.png'}" class="lb-avatar">
                            <div class="lb-info"><div class="lb-name">You (${lbData.userRank.username})</div></div>
                            <div class="lb-score">${lbData.userRank.totalPoints} pts</div>
                        </div>`;
                    }
                }
            } catch (e) { 
                document.getElementById('leaderboardList') 
                    ? document.getElementById('leaderboardList').innerHTML = '<div class="lb-row" style="justify-content:center;color:#ccc;font-weight:bold;">NEW! Could be you!</div>'
                    : document.getElementById('gameLeaderboardList').innerHTML = '<div class="lb-row" style="justify-content:center;color:#ccc;font-weight:bold;">NEW! Could be you!</div>';
            }

            if (isLoading) return; 
            isLoading = true;
            try {
                const data = await apiCall(`/games?limit=100`);
                if (data.games) {
                    allGames = data.games; 
                    updateGrid(allGames);
                }
            } catch (error) {
                showError('Failed to load games.');
            } finally {
                isLoading = false;
            }
        }

        const searchInput = document.getElementById('searchInput');
        const gameGrid = document.getElementById('gameGrid');
        const suggestionsDiv = document.getElementById('suggestions');

        const gameModal = document.getElementById('gameModal');
        const modalWindowContent = document.getElementById('modalWindowContent');
        const closeModalBtn = document.getElementById('closeModal');
        const modalGameTitle = document.getElementById('modalGameTitle');
        const modalTrailer = document.getElementById('modalTrailer');
        const modalAge = document.getElementById('modalAge');
        const modalF2P = document.getElementById('modalF2P');
        const modalAFK = document.getElementById('modalAFK');
        const modalStory = document.getElementById('modalStory');
        const modalGameplay = document.getElementById('modalGameplay');
        const modalOverall = document.getElementById('modalOverall');

        const API_BASE = window.location.origin + '/api';
        let currentTrailerId = ''; 

        const debounce = (func, wait) => {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        };

        const showError = (message) => {
            console.error(message);
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #ff5555;
                color: white;
                padding: 10px 20px;
                border-radius: 5px;
                z-index: 1000;
            `;
            errorDiv.textContent = message;
            document.body.appendChild(errorDiv);
            
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        };

        const apiCall = async (endpoint, options = {}) => {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }

                return await response.json();
            } catch (error) {
                console.error(`API call failed for ${endpoint}:`, error);
                throw error;
            }
        };

        const searchGames = async (query) => {
            if (!query || query.length === 0) {
                isSearching = false;
                currentPage = 1;
                loadGames(1, false);
                return;
            }
            if (query.length < 2) return;

            isSearching = true;

            try {
                const results = await apiCall(`/games/search/${encodeURIComponent(query)}`);
                updateGrid(results);
            } catch (error) {
                const filtered = allGames.filter(game => 
                    game.name.toLowerCase().includes(query.toLowerCase())
                );
                updateGrid(filtered);
            }
        };

        function openGameModal(game, cardElement) {
            const rect = cardElement.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;
            const cardCenterY = rect.top + rect.height / 2;
            const viewportCenterX = window.innerWidth / 2;
            const viewportCenterY = window.innerHeight / 2;
            
            const deltaX = cardCenterX - viewportCenterX;
            const deltaY = cardCenterY - viewportCenterY;
            
            modalWindowContent.style.setProperty('--start-x', `${deltaX}px`);
            modalWindowContent.style.setProperty('--start-y', `${deltaY}px`);

            modalGameTitle.textContent = game.name || 'Unknown Game';
            
            if (game.trailer_id && currentTrailerId !== game.trailer_id) {
                modalTrailer.src = `https://www.youtube-nocookie.com/embed/${game.trailer_id}?autoplay=1`;
                currentTrailerId = game.trailer_id;
            } else if (!game.trailer_id) {
                modalTrailer.src = ''; 
                currentTrailerId = '';
            }
            
            modalAge.textContent = game.ratings?.age || 'N/A';
            modalF2P.textContent = game.ratings?.f2p || 'N/A';
            modalAFK.textContent = game.ratings?.afk || 'N/A';
            modalStory.textContent = game.ratings?.story || 'N/A';
            modalGameplay.textContent = game.ratings?.gameplay || 'N/A';
            modalOverall.textContent = game.ratings?.overall || 'N/A';
            
            gameModal.classList.add('active');
        }

        function closeGameModal() {
            gameModal.classList.remove('active');
            setTimeout(() => { 
                modalTrailer.src = ''; 
                currentTrailerId = '';
            }, 400); 
        }

        closeModalBtn.addEventListener('click', closeGameModal);

        gameModal.addEventListener('click', function(e) {
            if (e.target === gameModal) {
                closeGameModal();
            }
        });
        function updateGrid(games) {
            gameGrid.innerHTML = ''; 
            
            const selectedTag = document.getElementById('tagFilter') ? document.getElementById('tagFilter').value : 'All';
            let filteredGames = games;
            
            if (selectedTag !== 'All') {
                filteredGames = games.filter(g => g.tags && g.tags.includes(selectedTag));
            }

            filteredGames.sort((a, b) => {
                // Priority 1: Starred status
                const aStar = userStarredGames.includes(a.id) ? 1 : 0;
                const bStar = userStarredGames.includes(b.id) ? 1 : 0;
                if (aStar !== bStar) return bStar - aStar; 
                
                // Priority 2: Has Content vs Grayed out
                const aData = !!(a.overview_text || (a.guides && a.guides.length) || (a.assets && a.assets.length) || (a.communities && a.communities.length) || (a.mods && a.mods.length) || a.trailer_id || a.ratings) ? 1 : 0;
                const bData = !!(b.overview_text || (b.guides && b.guides.length) || (b.assets && b.assets.length) || (b.communities && b.communities.length) || (b.mods && b.mods.length) || b.trailer_id || b.ratings) ? 1 : 0;
                if (aData !== bData) return bData - aData;

                // Priority 3: Alphabetical Fallback
                return a.name.localeCompare(b.name);
            });

            if (filteredGames.length === 0) {
                gameGrid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; color: white; padding: 40px;">
                        <h3>No games found</h3>
                    </div>
                `;
                return;
            }

            filteredGames.forEach(game => {
                const gridItem = document.createElement('div');
                const hasData = typeof game === 'object' && !!(game.overview_text || game.guides || game.assets || game.communities || game.mods || game.trailer_id || game.ratings);
                gridItem.className = `grid-item ${hasData ? '' : 'no-data'}`;
                
                const gameName = typeof game === 'string' ? game : game.name;
                const iconUrl = typeof game === 'object' && game.banner_url ? game.banner_url : '/Assets/placeholder.png';
                const developer = typeof game === 'object' && game.developer ? game.developer : '';
                
                const isStarred = userStarredGames.includes(game.id);
                const starColor = isStarred ? '#ffc107' : '#555';

                gridItem.innerHTML = `
                    <img src="${iconUrl}" alt="${gameName}" loading="lazy" onerror="this.src='/Assets/placeholder.png'">
                    <div class="title-wrapper">
                        <svg class="star-btn" data-id="${game.id}" style="width:18px;height:18px;cursor:pointer;fill:${starColor}; transition:fill 0.2s;" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                        <div class="grid-item-title">${escapeHtml(gameName)}</div>
                        <div class="info-icon ${hasData ? '' : 'disabled'}" title="${hasData ? 'View Game Details' : 'No Data Available'}">i</div>
                    </div>
                    ${developer ? `<div class="grid-item-dev">${escapeHtml(developer)}</div>` : ''}
                `;
                
                const starBtn = gridItem.querySelector('.star-btn');
                starBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (!cachedSession.discordId) return alert('Must be signed in to star games!');
                    if (userStarredGames.includes(game.id)) {
                        userStarredGames = userStarredGames.filter(id => id !== game.id);
                    } else {
                        userStarredGames.push(game.id);
                    }
                    updateGrid(allGames); 
                    await fetch('/api/user/star', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ gameId: game.id }) });
                });

                const infoBtn = gridItem.querySelector('.info-icon');
                infoBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); 
                    if (hasData) {
                        openGameModal(typeof game === 'object' ? game : { name: gameName }, gridItem);
                    }
                });
                
                gridItem.addEventListener('click', () => {
                    if (game.id && hasData) {
                        window.location.href = `/games/${game.id}`;
                    }
                });
                
                gameGrid.appendChild(gridItem);
            });

            // Append Suggest Game Box
            const suggestCard = document.createElement('div');
            suggestCard.className = 'grid-item';
            suggestCard.style.border = '2px dashed #7A6BB5';
            suggestCard.innerHTML = `
                <div style="height: 140px; display: flex; align-items: center; justify-content: center;">
                    <svg viewBox="0 0 24 24" style="width:40px;height:40px;fill:#ffffff;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                </div>
                <div class="title-wrapper"><div class="grid-item-title">Suggest a Game</div></div>
                <div class="grid-item-dev">Don't see your game?</div>
            `;
            suggestCard.addEventListener('click', () => {
                if (!cachedSession.discordId) return alert('Must be logged in to suggest games!');
                document.getElementById('suggestModal').classList.add('active');
            });
            gameGrid.appendChild(suggestCard);
        }

        // Search Bar Toggle Logic
        document.getElementById('searchToggle').addEventListener('click', () => {
            const input = document.getElementById('searchInput');
            if (input.style.width === '0px' || input.style.width === '') {
                input.style.width = '100%'; input.style.opacity = '1'; input.style.padding = '12px 20px'; input.focus();
            } else {
                input.style.width = '0'; input.style.opacity = '0'; input.style.padding = '12px 0'; input.value = '';
                updateGrid(allGames);
            }
        });

        document.getElementById('tagFilter').addEventListener('change', () => {
            updateGrid(allGames);
        });

        // Better Age Ratings logic for the Info Modal
        function openGameModal(game, cardElement) {
            // ... existing positional logic ...
            const esrbMap = { 'E': 'E (Everyone)', 'T': 'T (Teen)', 'M': 'M (Mature 17+)' };
            modalAge.textContent = esrbMap[game.ratings?.age] || (game.ratings?.age || 'N/A');
            // ...
        }

        const escapeHtml = (text) => {
            const map = {
                '&': '&',
                '<': '<',
                '>': '>',
                '"': '"',
                "'": '&#39;'
            };
            return text.replace(/[&<>"']/g, (m) => map[m]);
        };

        const debouncedSearch = debounce(searchGames, 300);

        document.addEventListener('DOMContentLoaded', () => {
            fetchInitialData();
            
            // Attach Tag Filter Listener
            const tagFilter = document.getElementById('tagFilter');
            if (tagFilter) tagFilter.addEventListener('change', () => updateGrid(allGames));

            // Attach Search Toggle Listener
            const searchToggle = document.getElementById('searchToggle');
            if (searchToggle) {
                searchToggle.addEventListener('click', () => {
                    const input = document.getElementById('searchInput');
                    if (input.style.width === '0px' || input.style.width === '') {
                        input.style.width = '100%'; input.style.opacity = '1'; input.style.padding = '12px 20px'; input.focus();
                    } else {
                        input.style.width = '0'; input.style.opacity = '0'; input.style.padding = '12px 0'; input.value = ''; updateGrid(allGames);
                    }
                });
            }
        });

        searchInput.addEventListener('input', function() {
            debouncedSearch(this.value.trim());
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                this.value = '';
                isSearching = false;
                updateGrid(allGames);
            }
        });

        async function lookupGame() {
            const term = document.getElementById('suggestSearch').value;
            if (!term) return;
            try {
                const res = await fetch(`/api/suggest/lookup?term=${encodeURIComponent(term)}`);
                const data = await res.json();
                if (data.found) {
                    document.getElementById('sgName').value = data.name;
                    document.getElementById('sgDev').value = data.developer;
                    document.getElementById('sgTags').value = data.tags.join(', ');
                    document.getElementById('sgDesc').value = data.overview_text;
                    document.getElementById('sgIcon').value = data.icon_url;
                    
                    // Reveal the visual preview
                    const preview = document.getElementById('sgIconPreview');
                    preview.src = data.icon_url;
                    preview.style.display = 'block';
                } else alert("Game not found in Apple Database. Please fill manually.");
            } catch (e) { alert("Lookup failed."); }
        }

        async function submitSuggestion() {
            const payload = {
                gameId: document.getElementById('sgName').value.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                itemCategory: 'Game',
                actionType: 'CREATE',
                data: {
                    id: document.getElementById('sgName').value.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                    name: document.getElementById('sgName').value,
                    developer: document.getElementById('sgDev').value,
                    tags: document.getElementById('sgTags').value.split(',').map(s=>s.trim()),
                    overview_text: document.getElementById('sgDesc').value,
                    banner_url: document.getElementById('sgIcon').value
                }
            };
            try {
                await fetch('/api/contribute', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                alert("Game suggested successfully! Awaiting Admin Approval.");
                document.getElementById('suggestModal').classList.remove('active');
            } catch (e) { alert("Failed to submit."); }
        }

        window.addEventListener('online', () => fetchInitialData());
    </script>
</body>
</html>
